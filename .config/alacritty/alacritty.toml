# Import colorscheme
general.import = ["~/.config/alacritty/theme-active.toml"]

[env]
ALACRITTY = "true"
TERM = "xterm-256color"

[window]
opacity = 1
padding.x = 5
padding.y = 5
decorations = "Full"
startup_mode = "Maximized"

[font]
normal.family = "Inconsolata Nerd Font Mono"
bold.family = "Inconsolata Nerd Font Mono"
italic.family = "Inconsolata Nerd Font Mono"
bold_italic.family = "Inconsolata Nerd Font Mono"
size = 18.0

[terminal]
shell = "/bin/zsh"

[hints]
# home row labels first
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
regex = "(https?://|ftp://|mailto:|file://)[^\\s]+"
hyperlinks = true
post_processing = true
persist = false
command = { program = "/usr/bin/open" }
mouse = { enabled = true }
binding = { key = "U", mods = "Command|Shift" }
